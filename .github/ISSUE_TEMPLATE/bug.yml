name: Bug
description: Something is broken or wrong.
title: "Bug: <short description>"
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where
      options: [Web app, API, Data source, Vision model, Routing, Alerts, Deploy or CI]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Choose ...
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: ["Breaks the demo", "Wrong result", "Minor"]
    validations:
      required: true
